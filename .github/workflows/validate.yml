name: Validate LLM Firewall

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/validate.yml'
      - '.terraform-version'
      - 'lambda/**'
      - 'terraform/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements-client.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate.yml'
      - '.terraform-version'
      - 'lambda/**'
      - 'terraform/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements-client.lock'

permissions:
  contents: read

env:
  TF_VERSION: '1.14.9'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install hash-locked signing client dependencies
        run: python3 -m pip install --require-hashes -r requirements-client.lock

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate Terraform and its dependency lock
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform validate
