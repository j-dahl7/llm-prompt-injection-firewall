name: Validate LLM Firewall

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/validate.yml'
      - '.terraform-version'
      - 'lambda/**'
      - 'terraform/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements-client.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate.yml'
      - '.terraform-version'
      - 'lambda/**'
      - 'terraform/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements-client.lock'

permissions:
  contents: read

env:
  TF_VERSION: '1.14.9'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install hash-locked signing client dependencies
        run: python3 -m pip install --require-hashes -r requirements-client.lock

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate Terraform and its dependency lock
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform validate
